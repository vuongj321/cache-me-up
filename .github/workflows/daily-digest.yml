name: Daily Tech Digest

# docs/ARCHITECTURE.md section 7 — cron-job.org provides the "clock".
#
# There is deliberately no `schedule:` entry here. An external scheduler
# (https://cron-job.org) sends one HTTP request a day to GitHub's
# "create a workflow dispatch event" endpoint, which starts this workflow
# through the `workflow_dispatch` trigger below. Keeping the schedule outside
# GitHub means it is not subject to GitHub's best-effort cron queueing (runs
# queued at the top of an hour can be delayed or dropped) and not to GitHub's
# rule that disables a `schedule`-driven workflow after ~60 days without
# repository activity.
#
# The scheduler's request looks like this (the token is a fine-grained PAT with
# "Actions: write" on this repository; it lives in cron-job.org, never here):
#
#   POST https://api.github.com/repos/vuongj321/cache-me-up/actions/workflows/daily-digest.yml/dispatches
#   Headers:
#     Authorization: Bearer <fine-grained PAT>
#     Accept: application/vnd.github+json
#     X-GitHub-Api-Version: 2022-11-28
#     Content-Type: application/json
#   Body:
#     {"ref":"main","inputs":{"dry_run":"false","log_level":"info"}}
#
# A 204 response means "dispatch accepted", not "digest posted"; whether the run
# succeeded is visible in the Actions tab. The job fires at 05:05
# America/Chicago year-round (cron-job.org holds the timezone and handles DST).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run the pipeline but print the digest instead of posting it'
        type: boolean
        default: false
      log_level:
        description: 'Log verbosity'
        type: choice
        options: [info, debug, warn, error]
        default: info

# Never let two digests overlap (a scheduled dispatch, a cron-job.org retry, or
# a manual run). A second dispatch waits instead of racing the first one.
concurrency:
  group: daily-digest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
      # Raise this (repo variable) if a run fails with "LLM output was truncated".
      LLM_MAX_OUTPUT_TOKENS: ${{ vars.LLM_MAX_OUTPUT_TOKENS || '6000' }}
      # Optional; raises the GitHub search API rate limit (not the trending scrape).
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LOG_LEVEL: ${{ inputs.log_level || 'info' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The runner is ephemeral, so the seen cache is persisted between runs.
      # Each run saves a fresh key; `restore-keys` picks up the newest previous
      # one, which makes the seen list effectively "a few days" long.
      # The `v2` prefix deliberately ignores caches written before the change that
      # records only posted items — those hold "considered" entries for stories
      # that were never sent, which would keep suppressing them for days.
      - name: Restore seen cache
        uses: actions/cache/restore@v4
        with:
          path: data/seen.json
          key: seen-v2-${{ github.run_id }}
          restore-keys: |
            seen-v2-

      # `github.event.inputs.*` is always string-typed, so this comparison works
      # for both triggers: the Actions UI (which renders a real boolean) and the
      # REST API (which delivers input values as strings — and the string
      # "false" is truthy in expressions, so `inputs.dry_run && …` would wrongly
      # add --dry-run to every dispatched run).
      - name: Run digest
        run: npm run digest ${{ (github.event.inputs.dry_run == 'true' || inputs.dry_run == true) && '-- --dry-run' || '' }}

      - name: Save seen cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/seen.json
          key: seen-v2-${{ github.run_id }}
