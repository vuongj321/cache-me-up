name: Daily Tech Digest

# docs/ARCHITECTURE.md section 7 — GitHub Actions provides the "cron".
on:
  schedule:
    # GitHub cron is always UTC and cannot follow daylight saving time, so both
    # hours that can be 5:00 AM local are scheduled and the `gate` job keeps the
    # one that is today's 05:00 in America/Chicago (10:05 UTC on CDT, 11:05 UTC on CST).
    # Minute :05 dodges GitHub's documented "start of every hour" delay window.
    - cron: '5 10 * * *'
    - cron: '5 11 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run the pipeline but print the digest instead of posting it'
        type: boolean
        default: false
      log_level:
        description: 'Log verbosity'
        type: choice
        options: [info, debug, warn, error]
        default: info

# Never let two digests overlap (a manual run plus the scheduled one).
concurrency:
  group: daily-digest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # GitHub cron cannot follow daylight saving time, so both candidate hours are
  # scheduled above and this job runs only the one that is today's 5:00 AM in the
  # digest's home timezone. It compares the cron entry that fired — not the wall
  # clock — so a run that GitHub delayed past the hour is still allowed through.
  # Manual runs always proceed. No checkout and no npm install: it costs seconds.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}

    steps:
      - name: Decide whether this is today's 5:00 AM
        id: decide
        env:
          LOCAL_HOUR: '5'
          LOCAL_TIMEZONE: America/Chicago
        run: |
          set -euo pipefail

          # Manual runs never consult the schedule.
          if [ "${{ github.event_name }}" != 'schedule' ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The cron entry that triggered this run, e.g. "5 10 * * *" -> "10".
          cron_hour="$(awk '{ print $2 }' <<< "${{ github.event.schedule }}")"

          # No cron string to reason about? Fail open: a duplicate digest is
          # better than a missing one.
          if [ -z "$cron_hour" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Which UTC hour is LOCAL_HOUR:00 in LOCAL_TIMEZONE today? The offset is
          # read at that local time, so this stays correct on the DST switch-over days.
          offset="$(TZ="$LOCAL_TIMEZONE" date -d "today ${LOCAL_HOUR}:00" +%z)"
          offset="${offset//:/}"
          hours=$(( 10#${offset:1:2} ))
          if [ "${offset:0:1}" = '-' ]; then
            utc_hour=$(( (LOCAL_HOUR + hours) % 24 ))
          else
            utc_hour=$(( (LOCAL_HOUR - hours + 24) % 24 ))
          fi

          cron_hour="$(printf '%02d' "$(( 10#$cron_hour ))")"
          utc_hour="$(printf '%02d' "$utc_hour")"

          if [ "$cron_hour" = "$utc_hour" ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo "::notice::${cron_hour}:05 UTC is today's ${LOCAL_HOUR}:00 ${LOCAL_TIMEZONE} — running the digest."
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo "::notice::${cron_hour}:05 UTC is not today's ${LOCAL_HOUR}:00 ${LOCAL_TIMEZONE} (UTC${offset}) — that hour belongs to the other cron entry; skipping."
          fi

  digest:
    needs: [gate]
    # The gate declines whichever cron entry is not today's 5:00 AM local; a
    # skipped job is a success, not a failure.
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'https://api.openai.com/v1' }}
      # Raise this (repo variable) if a run fails with "LLM output was truncated".
      LLM_MAX_OUTPUT_TOKENS: ${{ vars.LLM_MAX_OUTPUT_TOKENS || '6000' }}
      # Optional; raises the GitHub search API rate limit (not the trending scrape).
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LOG_LEVEL: ${{ inputs.log_level || 'info' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The runner is ephemeral, so the seen cache is persisted between runs.
      # Each run saves a fresh key; `restore-keys` picks up the newest previous
      # one, which makes the seen list effectively "a few days" long.
      # The `v2` prefix deliberately ignores caches written before the change that
      # records only posted items — those hold "considered" entries for stories
      # that were never sent, which would keep suppressing them for days.
      - name: Restore seen cache
        uses: actions/cache/restore@v4
        with:
          path: data/seen.json
          key: seen-v2-${{ github.run_id }}
          restore-keys: |
            seen-v2-

      - name: Run digest
        run: npm run digest ${{ inputs.dry_run && '-- --dry-run' || '' }}

      - name: Save seen cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/seen.json
          key: seen-v2-${{ github.run_id }}
